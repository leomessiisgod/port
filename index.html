<title>유승현 영역 모의평가</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 시험지 한 장. 넓은 화면은 가운데 세로선으로 나눈 두 단, 좁은 화면은 한 단. 채점은 빨간 펜. 종이 느낌을 지키려고 밝은 화면 하나로만 갑니다. */
:root{
  --desk:#e7e6e1; --paper:#fffffd; --ink:#1b1b1b; --sub:#5d5d58; --rule:#1b1b1b; --hair:#cfcec8;
  --pen:#d8261c; --pen-soft:#fdecea; --pick:#1b1b1b;
  --q:"Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --ui:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --hand:"Nanum Pen Script","Comic Sans MS",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font-family:var(--q);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.sheet{max-width:980px;margin:0 auto;background:var(--paper);border:1px solid var(--hair);box-shadow:0 1px 0 #d4d3cd,0 12px 30px -18px rgba(0,0,0,.25);
  padding:28px clamp(16px,4vw,44px) 36px;position:relative}
p{margin:0}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--pen);outline-offset:2px}

/* 머리 */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:12px;font-family:var(--ui);font-size:13px;color:var(--sub)}
.top .r{text-align:right}
.odd{border:1.5px solid var(--ink);color:var(--ink);padding:2px 10px;font-weight:700;font-size:15px;justify-self:center;font-family:var(--q)}
.title{text-align:center;padding-block:14px 10px;border-bottom:3px double var(--rule)}
.title h1{margin:0;font-weight:800;font-size:clamp(28px,6vw,46px);letter-spacing:.06em;line-height:1.25}
.title p{font-family:var(--ui);font-size:14px;color:var(--sub);margin-top:4px}
.meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px;padding-block:12px;border-bottom:1px solid var(--rule);font-family:var(--ui);font-size:14px}
.meta span b{font-weight:500}
.meta .blank{display:inline-block;min-width:7em;border-bottom:1px solid var(--ink);text-align:center;font-family:var(--hand);font-size:24px;line-height:1;color:var(--pen)}
.guide{font-family:var(--ui);font-size:13.5px;color:var(--sub);padding-block:12px;border-bottom:1px solid var(--hair)}

/* 문제 */
.qs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 56px;padding-top:22px;position:relative}
.qs::before{content:"";position:absolute;top:22px;bottom:0;left:50%;border-left:1px solid var(--rule)}
.col{min-width:0}
@media (max-width:760px){.qs{grid-template-columns:1fr}.qs::before{display:none}}
.q{break-inside:avoid;padding-bottom:30px;position:relative}
.qhead{display:flex;gap:8px;align-items:baseline}
.no{font-weight:800;font-size:19px;position:relative;flex:none;width:1.6em}
.no svg{position:absolute;left:-14px;top:-14px;width:54px;height:54px;overflow:visible;pointer-events:none}
.stem{font-size:16.5px;line-height:1.7}
.stem b{font-weight:800}
.pts{font-family:var(--ui);font-size:12.5px;color:var(--sub);white-space:nowrap}
.box{border:1px solid var(--ink);padding:10px 12px;margin:10px 0 4px 2.2em;font-size:15px;line-height:1.65}
.ch{list-style:none;margin:10px 0 0 2.2em;padding:0;display:flex;flex-direction:column;gap:2px}
.ch button{display:flex;gap:8px;width:100%;text-align:left;background:none;border:0;padding:5px 6px;cursor:pointer;font-family:var(--q);font-size:15.5px;line-height:1.55;border-radius:2px}
.ch button:hover:not(:disabled){background:#f2f1ec}
.ch button:disabled{cursor:default}
.ch .m{flex:none;width:1.3em}
.ch button.pick .m{background:var(--pick);color:var(--paper);border-radius:50%;text-align:center;width:1.3em;height:1.3em;line-height:1.3em;font-size:.85em;margin-top:.15em}
.ch button.right{position:relative}
.ch button.right::after{content:"";position:absolute;left:-2px;top:50%;width:calc(100% - 8px);height:60%;transform:translateY(-50%) rotate(-.6deg);
  border:2px solid var(--pen);border-radius:50%/60%;pointer-events:none}
.slider{margin:14px 0 0 2.2em;display:flex;flex-direction:column;gap:8px;font-family:var(--ui)}
.slider .v{font-family:var(--q);font-size:28px;font-weight:800;line-height:1}
.slider .v small{font-size:15px;font-weight:400}
.slider input{width:100%;accent-color:var(--ink)}
.slider .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.submit{align-self:flex-start;font-family:var(--ui);font-size:14px;background:var(--ink);color:var(--paper);border:0;padding:8px 16px;cursor:pointer}
.sol{margin:12px 0 0 2.2em;border-left:2px solid var(--pen);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:6px;font-family:var(--ui);font-size:14px;line-height:1.7;color:#2a2a2a}
.sol .pen{font-family:var(--hand);color:var(--pen);font-size:25px;line-height:1.1}
.sol .src{font-size:12px;color:var(--sub)}
.sol img{width:96px;border:1px solid var(--hair);display:block}
.sol .row{display:flex;gap:12px;align-items:flex-start}
.sol .row > div{min-width:0}
.big{font-family:var(--q);font-weight:800;font-size:22px;color:var(--ink);line-height:1.3}

/* 교시 */
.sec{padding-top:26px}
.sec + .sec{margin-top:10px;border-top:3px double var(--rule)}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sechead h2{margin:0;font-weight:800;font-size:clamp(20px,3.6vw,26px);letter-spacing:.04em}
.sechead h2 small{font-family:var(--ui);font-weight:500;font-size:13px;color:var(--sub);letter-spacing:0;margin-right:8px}
.sechead .sc{font-family:var(--hand);color:var(--pen);font-size:28px;line-height:1;min-height:28px}
.secend{font-family:var(--ui);font-size:13.5px;color:var(--sub);padding-bottom:6px;text-align:right}
/* 채점 */
.score{border-top:3px double var(--rule);margin-top:6px;padding-top:18px;display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;justify-content:space-between}
.score .left{display:flex;flex-direction:column;gap:4px;min-width:0;max-width:34em}
.score .left b{font-size:20px;font-weight:800}
.score .left span{font-family:var(--ui);font-size:14px;color:var(--sub)}
.mark{font-family:var(--hand);color:var(--pen);font-size:64px;line-height:.9;transform:rotate(-6deg);white-space:nowrap;padding-right:8px}
.mark small{font-size:32px}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:28px;font-family:var(--ui);font-size:12.5px;color:var(--sub)}
.foot .pg{font-family:var(--q);color:var(--ink)}
@media (prefers-reduced-motion:no-preference){
  .no svg path{stroke-dasharray:200;stroke-dashoffset:200;animation:draw .45s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
}
</style>

<div class="sheet">
  <div class="top"><span>모의평가 문제지</span><span class="odd">홀수형</span><span class="r">1 · 2교시</span></div>
  <div class="title">
    <h1>유승현 영역</h1>
  </div>
  <div class="meta">
    <span><b>성명</b> 채용 담당자님</span>
    <span><b>문항 수</b> 16</span>
    <span><b>시간</b> 약 4분</span>
    <span><b>점수</b> <span class="blank" id="scoreTop">&nbsp;</span></span>
  </div>

  <div id="secs"></div>

  <div class="score" id="score">
    <div class="left">
      <b id="scoreLine">두 교시를 모두 풀면 여기에 총점이 나옵니다.</b>
      <span id="scoreSub">문제마다 포트폴리오의 한 장면을 담았습니다.</span>
    </div>
    <div class="mark" id="mark" aria-live="polite"></div>
  </div>

  <div class="foot"><span>출제 유승현 · 브랜드 마케터</span><span class="pg">1</span><span>이 문제지의 숫자는 포트폴리오 v4 기준입니다.</span></div>
</div>

const SECS = [
 {key:'p', no:'제1교시', name:'인물 탐구', items:[OLD[0],QA.A,QA.B,QA.C,QA.E,QA.F], pts:[2,2,2,2,2,2]},
 {key:'m', no:'제2교시', name:'마케팅 탐구', items:[OLD[1],OLD[2],QA.G,OLD[3],QA.H,OLD[4],QA.I,OLD[5],OLD[6],QA.K], pts:[2,2,2,2,2,2,2,2,3,3]}
];
const TOTAL = SECS.reduce((s,x)=>s+x.items.length,0);
const MK=['①','②','③','④'];
const state={};
const circle='<svg viewBox="0 0 54 54" aria-hidden="true"><path d="M30 6 C14 4 4 16 6 30 C8 44 24 50 38 46 C50 41 52 24 44 13 C39 7 31 5 22 8" fill="none" stroke="#d8261c" stroke-width="2.6" stroke-linecap="round"/></svg>';
const slash='<svg viewBox="0 0 54 54" aria-hidden="true"><path d="M8 44 L46 6" fill="none" stroke="#d8261c" stroke-width="2.8" stroke-linecap="round"/></svg>';
function el(h){const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild}
function solHtml(q,ok){
  const head = ok ? '맞았습니다' : `정답은 ${MK[q.a]}`;
  const body = q.img ? `<div class="row"><img src="${THUMB}" alt="먹대위 호텔빙수 영상 썸네일"><div>${q.sol}</div></div>` : `<p>${q.sol}</p>`;
  return `<div class="sol"><span class="pen">${head}</span>${body}<span class="src">${q.src}</span></div>`;
}
const secRoot=document.getElementById('secs');
SECS.forEach((S,si)=>{
  const half=Math.ceil(S.items.length/2);
  const s=el(`<section class="sec" id="sec-${S.key}">
    <div class="sechead"><h2><small>${S.no}</small>${S.name} 영역</h2><span class="sc" id="sc-${S.key}"></span></div>
    <div class="qs"><div class="col" id="${S.key}A"></div><div class="col" id="${S.key}B"></div></div>
    <p class="secend" id="end-${S.key}">${si===0?'2교시에는 2억 뷰를 만든 판단 10가지가 있습니다. 아래로 이어집니다.':'마지막 두 문제는 3점입니다.'}</p>
  </section>`);
  secRoot.appendChild(s);
  S.items.forEach((_,i)=>update(si,i,half));
});
function render(si,i){
  const S=SECS[si], q=S.items[i], id=`${S.key}${i+1}`, s=state[id], done=!!s, ok=done&&s.ok;
  const n=el(`<section class="q" id="q-${id}">
    <div class="qhead"><span class="no">${i+1}.${done?(ok?circle:slash):''}</span><p class="stem">${q.stem} <span class="pts">[${S.pts[i]}점]</span></p></div>
  </section>`);
  const ul=el('<ul class="ch"></ul>');
  q.ch.forEach((c,j)=>{
    const cls=[done&&s.v===j?'pick':'',done&&j===q.a?'right':''].join(' ');
    const li=el(`<li><button class="${cls}" id="${id}c${j+1}" ${done?'disabled':''}><span class="m">${MK[j]}</span><span>${c}</span></button></li>`);
    li.firstChild.addEventListener('click',()=>{state[id]={v:j,ok:j===q.a,p:S.pts[i]};update(si,i)});
    ul.appendChild(li);
  });
  n.appendChild(ul);
  if(done) n.appendChild(el(solHtml(q,ok)));
  return n;
}
function update(si,i,half){
  const S=SECS[si], id=`${S.key}${i+1}`, old=document.getElementById('q-'+id), n=render(si,i);
  if(old) old.replaceWith(n); else document.getElementById(S.key+(i<half?'A':'B')).appendChild(n);
  tally();
}
function tally(){
  let got=0,max=0,answered=0;
  SECS.forEach(S=>{
    let g=0,m=0,a=0;
    S.items.forEach((_,i)=>{const s=state[S.key+(i+1)]; m+=S.pts[i]; if(s){a++; if(s.ok) g+=s.p;}});
    got+=g;max+=m;answered+=a;
    const sc=document.getElementById('sc-'+S.key);
    if(sc) sc.textContent = a===S.items.length ? `${g} / ${m}점` : '';
  });
  const top=document.getElementById('scoreTop'), mark=document.getElementById('mark');
  if(!top) return;
  if(!answered){top.innerHTML='&nbsp;';return}
  top.textContent=`${got}점`;
  if(answered<TOTAL){
    document.getElementById('scoreLine').textContent=`${TOTAL-answered}문제 남았습니다.`;
    mark.textContent='';return;
  }
  mark.innerHTML=`${got}<small> / ${max}</small>`;
  const line = got===max ? '만점입니다. 면접에서는 포트폴리오에 없는 이야기를 준비해 가겠습니다.'
    : got>=max-8 ? '놓친 문제의 이야기는 면접에서 직접 설명드리겠습니다.'
    : '틀린 문제가 가장 재밌는 이야기입니다. 면접에서 하나씩 풀어 드리겠습니다.';
  document.getElementById('scoreLine').textContent=line;
  document.getElementById('scoreSub').textContent='전체 이야기는 포트폴리오 23쪽에 있습니다.';
}
tally();
